<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3f7"><meta name="color-scheme" content="light"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="description" content="เลือกภาคการศึกษาและรายวิชา Subject Examination"><script>(async()=>{try{const r=await fetch('site-state.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;const s=await r.json();const k='subject-examination-current';const u=new URL(location.href);const f=u.searchParams.get('_fresh');const seen=sessionStorage.getItem(k);if(seen!==s.updatedAt&&f!==s.updatedAt){sessionStorage.setItem(k,s.updatedAt);u.searchParams.set('_fresh',s.updatedAt);location.replace(u.href);return}sessionStorage.setItem(k,s.updatedAt);if(f){u.searchParams.delete('_fresh');history.replaceState(null,'',u.pathname+(u.search?'?'+u.searchParams.toString():'')+u.hash)}}catch(e){}})();document.write('<link rel="stylesheet" href="design-system.css?_='+Date.now()+'">');</script><title>เลือกรายวิชา · Subject Examination</title></head><body><div class="shell"><header class="topbar glass"><a class="brand" href="./"><span class="mark">MR</span><span>Subject Examination</span></a><nav class="nav"><a class="chip" href="./">หน้าแรก</a></nav></header><main class="picker-page"><section class="picker-intro"><div class="eyebrow">Subject Examinations</div><h1>แบบทดสอบ<br>รายวิชา</h1><p>เลือกเทอม และรายวิชาที่ต้องการทำแบบทดสอบ</p></section><div class="picker-steps" aria-label="ขั้นตอนการเลือก"><span class="step-pill active" data-step-pill="term">1 · เทอม</span><span class="step-pill" data-step-pill="course">2 · รายวิชา</span></div><section id="pickerStage" class="picker-stage" aria-live="polite"><div class="empty glass">กำลังโหลดข้อมูล...</div></section></main><footer class="footer glass">Subject Examination · ข้อสอบสร้างจาก Lecture ของรายวิชาเท่านั้น</footer></div><script>(()=>{const stage=document.getElementById('pickerStage');let data=null;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const setStep=s=>document.querySelectorAll('[data-step-pill]').forEach(x=>x.classList.toggle('active',x.dataset.stepPill===s));const arrow=(label,action)=>`<button class="circle-next" type="button" aria-label="${esc(label)}" data-action="${action}">&gt;</button>`;function term(){setStep('term');stage.innerHTML=`<div class="picker-section-head"><div><div class="eyebrow">เลือกเทอม</div><h2>เลือกเทอมการศึกษา</h2></div><p>ขั้นตอน 1 จาก 2</p></div><article class="journey-card glass dark-card"><div><div class="journey-label">${esc(data.academicCalendar.label)}</div><h3>เทอม ${data.semester}</h3><p>ปีการศึกษา ${esc(data.academicYear)}</p></div>${arrow(`เลือกเทอม ${data.semester}`,'course')}</article>`;bind();}function course(){setStep('course');const cards=data.courses.map(c=>`<article class="journey-card glass course-journey"><div class="journey-content"><div class="course-meta"><span class="tag">${esc(c.day)}</span><span class="tag status-current">${esc(data.academicCalendar.label)}</span></div><div class="course-code">${esc(c.code)}</div><h3>${esc(c.name)}</h3><p>คลังข้อมูล ${c.knowledgeTopics||0} หัวข้อ · คลังข้อสอบ ${c.bankSize||0} ชุด</p></div><a class="circle-next" href="${esc(c.path)}" aria-label="ไปยังแบบทดสอบ ${esc(c.code)}">&gt;</a></article>`).join('');stage.innerHTML=`<div class="picker-section-head"><div><button class="text-back" type="button" data-action="term">← เทอม ${data.semester}</button><div class="eyebrow">เลือกรายวิชา</div><h2>${data.courses.length} รายวิชา</h2></div><p>ขั้นตอน 2 จาก 2</p></div><div class="journey-list">${cards}</div>`;bind();}function bind(){stage.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>({term,course}[el.dataset.action]?.()));}fetch('courses.json?_='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{data=d;term()}).catch(()=>{stage.innerHTML='<div class="empty glass">โหลดข้อมูลรายวิชาไม่สำเร็จ</div>'})})();</script></body></html>
