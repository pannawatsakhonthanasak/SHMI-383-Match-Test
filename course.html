<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3f7"><meta name="color-scheme" content="light"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><script>(async()=>{try{const r=await fetch('site-state.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;const s=await r.json();const k='subject-examination-current';const u=new URL(location.href);const f=u.searchParams.get('_fresh');const seen=sessionStorage.getItem(k);if(seen!==s.updatedAt&&f!==s.updatedAt){sessionStorage.setItem(k,s.updatedAt);u.searchParams.set('_fresh',s.updatedAt);location.replace(u.href);return}sessionStorage.setItem(k,s.updatedAt);if(f){u.searchParams.delete('_fresh');history.replaceState(null,'',u.pathname+(u.search?'?'+u.searchParams.toString():'')+u.hash)}}catch(e){}})();document.write('<link rel="stylesheet" href="design-system.css?_='+Date.now()+'"><link rel="stylesheet" href="site-polish.css?_='+Date.now()+'"><link rel="stylesheet" href="exam-selectors.css?_='+Date.now()+'">');</script><title>Subject Examination</title></head><body data-course=""><div class="shell"><header class="topbar glass"><a class="brand" href="courses.html"><span class="mark">MR</span><span>Subject Examination</span></a><nav class="nav"><button class="chip" type="button" onclick="if(document.referrer&&document.referrer.startsWith(location.origin)){history.back()}else{location.href='courses.html'}">← ย้อนกลับ</button></nav></header><main class="exam-shell"><section class="exam-intro-card glass"><div class="exam-title-row"><div><div class="eyebrow" id="courseCode"></div><h1 id="courseName"></h1><p id="sourceSummary"></p></div></div><div class="exam-badges" aria-label="คุณสมบัติแบบทดสอบ"><span class="exam-badge">ไม่จำกัดจำนวนข้อ</span><span class="exam-badge">สร้างข้อต่อเนื่อง</span><span class="exam-badge good">Lecture-only</span></div></section><section class="top-selectors" aria-label="ตัวเลือกแบบทดสอบ"><div class="top-select-field"><label class="selector-label" for="modeSelect">รูปแบบข้อสอบ</label><select id="modeSelect" class="exam-select"><option value="match">จับคู่</option><option value="blank">เติมลงในช่องว่าง</option><option value="choice">ก, ข, ค, ง</option></select></div><div class="top-select-field"><label class="selector-label" for="levelSelect">ระดับความยาก</label><select id="levelSelect" class="exam-select"><option value="1">ง่าย</option><option value="2">ปานกลาง</option><option value="3">ยาก</option></select></div></section><p id="difficultyNote" class="difficulty-note"></p><section class="question-panel glass"><div class="question-toolbar"><div class="question-kicker" id="modeLabel"></div><strong class="progress-pill" id="progress"></strong></div><div id="questionArea"></div><div class="exam-actions"><div class="feedback" id="feedback" aria-live="polite"></div><div class="action-row"><button class="button exam-action" id="actionButton">ตรวจคำตอบ</button></div></div></section></main><section id="sourcePanel" class="section" hidden></section><footer class="footer glass">ใช้เนื้อหาเฉพาะ Lecture ของรายวิชานี้เท่านั้น</footer></div><script>(()=>{const course=new URLSearchParams(location.search).get('course');if(!course||!/^shmi-\d{3}$/.test(course)){location.replace('courses.html');return}document.body.dataset.course=course;const s=document.createElement('script');s.src='exam-engine.js?_='+Date.now();s.async=false;document.body.appendChild(s)})();</script></body></html>
